name: Real-World Deploy Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  checkout-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Extract Version
        id: version
        run: echo "version=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d ' ')" >> $GITHUB_OUTPUT
      
      - name: Log Version
        run: echo "Building version ${{ steps.version.outputs.version }}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: checkout-and-build
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm install && npm run build
      
      - name: Deploy to Staging
        uses: ./packages/action-deploy
        with:
          environment: staging
          version: ${{ needs.checkout-and-build.outputs.version }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [checkout-and-build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm install && npm run build
      
      - name: Deploy to Production
        uses: ./packages/action-deploy
        with:
          environment: production
          version: ${{ needs.checkout-and-build.outputs.version }}
      
      - name: Create Release
        run: echo "🎉 Released version ${{ needs.checkout-and-build.outputs.version }}"
